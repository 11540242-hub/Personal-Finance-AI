name: Deploy to GitHub Pages

# 當 Build workflow 完成時觸發
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Deploy artifact 到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact-path: dist

      # 3️⃣ 顯示部署 URL
      - name: Show Pages URL
        run: echo "Page deployed at ${{ steps.deploy.outputs.page_url }}"
